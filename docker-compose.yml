services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build: ./client
    environment:
      VITE_SERVER_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped